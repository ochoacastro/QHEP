const favRows=()=>S.favs.map(f=>{const i=f.indexOf(':'),k=f.slice(0,i),id=f.slice(i+1);let t='',sub='',u='';
if(k==='store'){const s=S.stores.find(x=>x.id===id);if(!s)return null;t=s.name;sub='Tienda · '+s.cat;u=storeUrl(id)}
else if(k==='prod'){const [sid,pid]=id.split('__'),s=S.stores.find(x=>x.id===sid),p=s&&s.products.find(x=>x.id===pid);if(!p)return null;t=p.name;sub='Producto · '+s.name+' · '+money(p.price);u=prodUrl(sid,pid)}

const legalHTML=w=>w==='priv'?`<p class="muted">Tratamiento de datos personales según la Ley 1581 de 2012 (habeas data) y sus decretos reglamentarios.</p><h3>Responsable</h3><p>${esc(site().name||'[Nombre del responsable]')}${site().mail?' · '+esc(site().mail):''}${site().wa?' · WhatsApp '+esc(site().wa):''}</p><h3>Datos que tratamos</h3><p>Tu nombre, tu número de WhatsApp o correo, barrio o zona, fotos y lo que escribes en publicaciones, calificaciones y sugerencias.</p><h3>Para qué los usamos</h3><ul><li>Verificar tu acceso con un código.</li><li>Mostrar tus publicaciones para que otros vecinos puedan verlas y contactarte.</li><li>Atender reportes y cuidar la seguridad del sitio.</li></ul><p>No vendemos tus datos.</p><h3>Datos sensibles y menores</h3><p>No pedimos datos sensibles. No publiques documentos de identidad ni fotos de menores de edad.</p><h3>Tus derechos</h3><p>Puedes conocer, actualizar, rectificar y suprimir tus datos y revocar tu autorización escribiendo al correo del responsable. También puedes editar o eliminar tus publicaciones y cerrar sesión cuando quieras.</p><h3>Dónde se guardan</h3><p>Hoy tu sesión y tus publicaciones se guardan en el almacenamiento de tu navegador, en este dispositivo.</p>`:`<p class="muted">Última actualización: octubre de 2026.</p><h3>Sobre Qué Hay en Pradera</h3><p>Un espacio para que vecinos de Pradera publiquen tiendas, servicios, arriendos, casas y vehículos. Qué Hay en Pradera no vende, no arrienda, no cobra comisiones ni intermedia pagos: los acuerdos se hacen directamente entre las personas.</p><h3>Tu responsabilidad</h3><p>Quien publica responde por la veracidad de su anuncio, sus fotos y su precio, y por cumplir la ley. Está prohibido publicar estafas, contenido ilegal, engañoso u ofensivo, o datos personales de terceros sin su permiso.</p><h3>Compras y encuentros</h3><p>Verifica el producto, el inmueble o el vehículo en persona y en un lugar seguro antes de pagar. Nunca compartas claves, códigos ni datos bancarios.</p><h3>Moderación</h3><p>Puedes reportar publicaciones. El administrador puede ocultar o eliminar las que incumplan estos términos.</p><h3>Vigencia de los anuncios</h3><p>Los anuncios de arriendos, casas y vehículos se muestran durante ${AD_DAYS} días y luego se ocultan. Quien publica puede renovarlos.</p>`;
function legalModal(w){modal(`<div class="legal"><h2>${w==='priv'?'Política de privacidad':'Términos de uso'}</h2>${legalHTML(w)}<div class="row" style="margin-top:12px"><button class="btn" data-act="close">Cerrar</button></div></div>`)}
(function(){if(S.migA)return;const OLD={'Arriendos':'arr','Venta de casas':'casa','Venta de vehículos':'veh'};
S.stores=S.stores.filter(s=>{const t=OLD[s.cat];if(!t)return true;const mine=S.mine.includes(s.id);
 (s.products||[]).forEach(p=>{const id='a'+uid(),f={};if(t==='veh'){if(p.vtype)f.vtype=p.vtype;if(p.fuel)f.fuel=p.fuel}
  S.ads.push({id,type:t,title:p.name,name:p.name,price:p.price,zone:s.zone||'',desc:p.d||'',f,imgs:p.imgs&&p.imgs.length?p.imgs:(p.img?[p.img]:[]),owner:s.owner||'Vecino',wa:s.wa||'',ts:Date.now(),closed:false,hidden:!!s.hidden,verified:!!s.verified});if(mine)S.myAds.push(id)});
 if(mine)S.mine=S.mine.filter(x=>x!==s.id);Object.keys(S.cart).forEach(k=>k.startsWith(s.id+'|')&&delete S.cart[k]);S.favs=S.favs.filter(x=>x!=='store:'+s.id);return false});
S.migA=1;save()})();

document.head.insertAdjacentHTML('beforeend',`<link rel="icon" href="${LOGO}">`);
/* v97: apariencia editable por el administrador (S.site.fav / logo = imagen o 'none'; theme = ''|'light'|'dark'; themeBtn = ''|'off'; themeV = versión) */
function applyLook(){try{const c=site(),h=document.documentElement,btn=c.themeBtn!=='off';
let u='';try{if((localStorage.getItem('qh_theme_v')||'')===String(c.themeV||''))u=localStorage.getItem('qh_theme')||''}catch(e){}
const m=(btn&&u)?u:(c.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')),d=m==='dark';
h.classList.toggle('dark',d);
/* v98: icono propio para modo oscuro (S.site.favD / logoD); si no existe, se usa el de modo claro */
const fv=c.fav,lg=(d&&c.logoD)?c.logoD:c.logo;
document.querySelectorAll('link[rel="icon"]').forEach(l=>l.remove());
if(fv!=='none')document.head.insertAdjacentHTML('beforeend',`<link rel="icon" href="${esc(fv||LOGO)}">`);
const hm=$('#home'),lk=String(lg||'')+(d?'|d':'');if(hm&&hm.dataset.lk!==lk){hm.dataset.lk=lk;hm.innerHTML=lg==='none'?'<b style="font-size:18px">Qué Hay en Pradera</b>':`<img src="${esc(lg||LOGO)}" alt="Qué Hay en Pradera">`}
const b=$('#themeBtn');if(b){b.style.display=btn?'':'none';b.textContent=d?'☀️':'🌙';b.title=d?'Modo claro':'Modo oscuro';b.setAttribute('aria-label',d?'Cambiar a modo claro':'Cambiar a modo oscuro')}
}catch(e){}}
