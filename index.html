  return `<details class="pled"${g==='store'?' open':''}><summary><b>${g==='all'?'📦 Planes anteriores (cuentas existentes)':USES[g].ico+' '+esc(USES[g].n)}</b></summary>${l.map(([k,d])=>`<div class="plcfg"><h4>${esc(d.n)} <small class="muted">(${k})</small></h4>${f(k,'n','Nombre',d.n)}${f(k,'price','Precio (COP; 0 = gratis)',d.price)}${f(k,'d','Descripción corta',d.d||'','Automática')}${g==='store'||g==='all'?f(k,'stores','Tiendas',nv(d.stores))+f(k,'prods','Productos por tienda',nv(d.prods))+f(k,'fs','Destacados de tiendas',nv(d.feat.store)):''}${g==='car'||g==='home'||g==='all'?f(k,'ads',g==='car'?'Vehículos':g==='home'?'Inmuebles':'Anuncios',nv(d.ads))+f(k,'fa','Destacados de anuncios',nv(d.feat.ad)):''}${g==='serv'||g==='all'?f(k,'servs','Servicios',nv(d.servs))+f(k,'fv','Destacados de servicios',nv(d.feat.serv)):''}<label style="display:flex;gap:8px;align-items:center;margin-top:8px"><input type="checkbox" id="pc-${k}-on"${d.on?' checked':''}> Mostrar este plan a la gente</label><div class="row" style="margin-top:8px"><button class="btn pink" data-act="plCfg" data-k="${k}">Guardar</button><button class="btn ghost" data-act="plRst" data-k="${k}">Restaurar</button></div></div>`).join('')}</details>`}).join('')}</div>`}
function planRows(){const l=QH.plans().sort((a,b)=>(a.end||0)-(b.end||0));if(!l.length)return '<div class="empty">Aún no hay usuarios con plan.</div>';
 return l.map(p=>{const d=planDef(p),U=p.use||'all',on=(p.end||0)>Date.now(),left=Math.ceil(((p.end||0)-Date.now())/DAY),own=a=>a.filter(o=>o.ownerKey===p.k),st=own(S.stores).length,ad=own(S.ads).filter(a=>!a.closed).length,sv=own(S.services).length,ft=[...own(S.stores),...own(S.services),...own(S.ads)].filter(o=>o.feat).length,dt=new Date(p.end||0).toLocaleDateString('es-CO');
  return `<div class="cg${on?'':' out'}"><b>${esc(p.name||'(sin nombre)')}</b> <small>· ${esc(p.wa||p.email||'')}</small><p class="muted">${d.n} · ${planTag(p)} · ${on?(p.plan==='free'?'sin vencimiento':left<=7?'vence en '+left+' d':'hasta el '+dt):'vencido el '+dt}<br>Tiendas ${st}/${d.stores===INF?'∞':d.stores} · Anuncios ${ad}/${d.ads===INF?'∞':d.ads} · Servicios ${sv}/${d.servs===INF?'∞':d.servs} · Destacados ${ft} (incluidos ${d.feat.ad===INF?'∞':d.feat.store+'+'+d.feat.serv+'+'+d.feat.ad} · extra pagados ${p.featSlots||0})</p><div class="row" style="margin-top:8px">${Object.entries(PLANS).filter(([k,x])=>x.use===U).map(([k,x])=>{const t=U==='all'?k:k.slice(U.length+1);return `<button class="btn${p.plan===t?'':' ghost'}" data-act="plSet" data-id="${p.k}" data-v="${t}">${esc(x.n)}</button>`}).join('')}</div><div class="row" style="margin-top:8px"><small class="muted">Tipo:</small>${Object.entries(USES).map(([k,x])=>`<button class="btn${U===k?'':' ghost'}" data-act="plKind" data-id="${p.k}" data-v="${k}">${x.ico}</button>`).join('')}</div><div class="row" style="margin-top:8px"><button class="btn pink" data-act="plMonth" data-id="${p.k}">Registrar pago · +30 días</button><button class="btn ghost" data-act="plFeat" data-id="${p.k}" data-d="-1">− destacado</button><button class="btn ghost" data-act="plFeat" data-id="${p.k}" data-d="1">+ destacado</button></div></div>`}).join('')}
const sortL=l=>sortBy==='rate'?l.slice().sort((a,b)=>avg(b.rates)-avg(a.rates)||(b.rates||[]).length-(a.rates||[]).length):sortBy==='az'?l.slice().sort((a,b)=>a.name.localeCompare(b.name,'es')):featFirst(l);
const isFav=(k,id)=>S.favs.includes(k+':'+id);
const need=f=>{if(S.user)f();else{after=f;loginForm()}};
const zonesOf=l=>[...new Set(l.map(x=>(x.zone||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));
const toolsHTML=k=>`<div class="tools"><label for="t-sort">Ordenar</label><select id="t-sort" data-sel="sort"><option value="">Más recientes</option><option value="rate"${sortBy==='rate'?' selected':''}>Mejor calificadas</option><option value="az"${sortBy==='az'?' selected':''}>A – Z</option></select><label for="t-zone">Barrio</label><select id="t-zone" data-sel="zone"><option value="">Todos</option>${zonesOf(k==='store'?S.stores:S.services).map(z=>`<option${zoneF===z?' selected':''}>${esc(z)}</option>`).join('')}</select><button class="chip" data-act="favf" aria-pressed="${favOnly}">Solo favoritos</button></div>`;

function tbInit(){clearInterval(tbTm);const t=$('#tbt');if(!t||t.children.length<2)return;const n=t.children.length,step=()=>t.children[1].offsetLeft-t.children[0].offsetLeft,idx=()=>Math.max(0,Math.min(n-1,Math.round(t.scrollLeft/(step()||1))));

const legalHTML=w=>w==='priv'?`<p class="muted">Tratamiento de datos personales según la Ley 1581 de 2012 (habeas data) y sus decretos reglamentarios.</p><h3>Responsable</h3><p>${esc(site().name||'[Nombre del responsable]')}${site().mail?' · '+esc(site().mail):''}${site().wa?' · WhatsApp '+esc(site().wa):''}</p><h3>Datos que tratamos</h3><p>Tu nombre, tu número de WhatsApp o correo, barrio o zona, fotos y lo que escribes en publicaciones, calificaciones y sugerencias.</p><h3>Para qué los usamos</h3><ul><li>Verificar tu acceso con un código.</li><li>Mostrar tus publicaciones para que otros vecinos puedan verlas y contactarte.</li><li>Atender reportes y cuidar la seguridad del sitio.</li></ul><p>No vendemos tus datos.</p><h3>Datos sensibles y menores</h3><p>No pedimos datos sensibles. No publiques documentos de identidad ni fotos de menores de edad.</p><h3>Tus derechos</h3><p>Puedes conocer, actualizar, rectificar y suprimir tus datos y revocar tu autorización escribiendo al correo del responsable. También puedes editar o eliminar tus publicaciones y cerrar sesión cuando quieras.</p><h3>Dónde se guardan</h3><p>Hoy tu sesión y tus publicaciones se guardan en el almacenamiento de tu navegador, en este dispositivo.</p>`:`<p class="muted">Última actualización: octubre de 2026.</p><h3>Sobre Qué Hay en Pradera</h3><p>Un espacio para que vecinos de Pradera publiquen tiendas, servicios, arriendos, casas y vehículos. Qué Hay en Pradera no vende, no arrienda, no cobra comisiones ni intermedia pagos: los acuerdos se hacen directamente entre las personas.</p><h3>Tu responsabilidad</h3><p>Quien publica responde por la veracidad de su anuncio, sus fotos y su precio, y por cumplir la ley. Está prohibido publicar estafas, contenido ilegal, engañoso u ofensivo, o datos personales de terceros sin su permiso.</p><h3>Compras y encuentros</h3><p>Verifica el producto, el inmueble o el vehículo en persona y en un lugar seguro antes de pagar. Nunca compartas claves, códigos ni datos bancarios.</p><h3>Moderación</h3><p>Puedes reportar publicaciones. El administrador puede ocultar o eliminar las que incumplan estos términos.</p><h3>Vigencia de los anuncios</h3><p>Los anuncios de arriendos, casas y vehículos se muestran durante ${AD_DAYS} días y luego se ocultan. Quien publica puede renovarlos.</p>`;

function shopCard(s){const c=catOf(s.cat),li=LISTING.includes(s.cat);return `<section class="shop sg" style="--c:${c[2]}" aria-label="${esc(s.name)}"><button class="sh" data-act="open" data-id="${s.id}" aria-label="Abrir ${esc(s.name)}"><span class="lgc"><span class="lg">${avatar(s,1)}</span>${QH.online(s.ownerKey)?'<span class="lgo">En línea</span>':''}</span><span class="si"><h3>${esc(s.name)}</h3><span class="sm">${rateLine(s)}<span>${esc(s.cat)}</span>${s.zone?`<span>· ${esc(s.zone)}</span>`:''}${badge(s)}${isFav('store',s.id)?'<span class="fav">♥</span>':''}</span>${(s.tags||[]).length?`<span class="tg">${s.tags.map(t=>'#'+esc(t)).join(' ')}</span>`:''}</span><span class="chev" aria-hidden="true">›</span></button><div class="prow">${s.products.length?s.products.map(p=>{const im=pimgs(p);return `<div class="pc"><button class="po" data-act="prod" data-sid="${s.id}" data-id="${p.id}" aria-label="Ver ${esc(p.name)} en ${esc(s.name)}"><span class="pi">${im.length?`<img src="${im[0]}" alt="" loading="lazy">`:esc(p.emoji||p.name.charAt(0).toUpperCase())}</span><span class="pn">${esc(p.name)}</span><span class="pp">${money(p.price)}${s.cat==='Arriendos'?' <small>/ mes</small>':''}</span></button>${li?'':`<button class="plus" data-act="add" data-sid="${s.id}" data-id="${p.id}" aria-label="Agregar ${esc(p.name)} al carrito"${p.out?' disabled':''}>+</button>`}</div>`}).join(''):`<span class="muted">Esta tienda aún no tiene ${li?'publicaciones':'productos'}.</span>`}</div></section>`}
function filtered(){const q=query.trim().toLowerCase();return sortL(S.stores.filter(s=>vis(s)&&(!zoneF||s.zone===zoneF)&&(!favOnly||isFav('store',s.id))&&(!cat||(cat==='@tiendas'?!MAIN_X.includes(s.cat):cat==='@super'?SUPER_RE.test(s.cat):s.cat===cat))&&(cat!=='Venta de vehículos'||(!vt&&!fu)||s.products.some(p=>(!vt||p.vtype===vt)&&(!fu||p.fuel===fu)))&&(!q||s.name.toLowerCase().includes(q)||(s.tags||[]).some(t=>q.replace(/#/g,'')&&t.includes(q.replace(/#/g,'')))||s.products.some(p=>p.name.toLowerCase().includes(q)))))}
const curTab=()=>{const t=ADT[view]?view:view==='ad'?((S.ads.find(x=>x.id===curAd)||{}).type||'home'):view==='serv'||view==='sug'||view==='map'||view==='guias'?view:'home';return t==='casa'?'arr':t};
