<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Página no encontrada – Mi Pradera</title>
<link rel="icon" href="/icon-192.png">
<script>/* v250: si la página de una noticia todavía no se ha creado (se crea cada hora), abre la noticia dentro de Mi Pradera */
(function(){var m=location.pathname.match(/^\/noticias\/(?:[a-z0-9-]*-)?([A-Za-z0-9_]+)(?:\.html)?\/?$/);if(m&&m[1]!=='index')location.replace('/#/nw/'+m[1])})();</script>
<style>
:root{--bg:#f5f5f7;--ink:#1d1d1f;--muted:#707070;--blue:#0071e3;--link:#0066cc;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#000;--ink:#f5f5f7;--muted:#a1a1a6;--link:#2997ff}.logo{filter:invert(1)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);font-family:'SF Pro Text',-apple-system,BlinkMacSystemFont,'Inter',system-ui,'Segoe UI',Roboto,sans-serif;letter-spacing:-.022em;line-height:1.47;text-align:center}
main{max-width:460px}
.logo{width:180px;height:auto;margin:0 auto 24px;display:block}
h1{font-family:'SF Pro Display',-apple-system,BlinkMacSystemFont,'Inter',system-ui,sans-serif;font-weight:600;font-size:34px;line-height:1.1;margin:0 0 8px}
p{font-size:17px;color:var(--muted);margin:0 0 24px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
a.btn{display:inline-block;padding:11px 21px;border-radius:980px;font-size:15px;text-decoration:none;min-height:44px}
a.p{background:var(--blue);color:#fff}
a.s{border:1px solid var(--link);color:var(--link)}
</style>
</head>
<body>
<main>
<img class="logo" src="/icon-512.png" alt="Mi Pradera" width="180" height="180">
<h1>No encontramos esta página</h1>
<p>Puede que el enlace esté mal escrito o que la publicación ya no exista.</p>
<div class="row"><a class="btn p" href="/">Ir al inicio</a><a class="btn s" href="/#/comunidad">Ver clasificados</a></div>
</main>
</body>
</html>
